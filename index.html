<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTC Crypto</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="main-container">
    <section id="authSection" class="auth-section show">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand">🪙 RTC CRYPTO</div>
          <p>Follow the market, explore paper trades.</p>
        </div>

        <div id="loginFormWrap" class="form-panel show">
          <h2>Sign In</h2>
          <form id="loginForm">
            <div class="field-group">
              <label>Email</label>
              <input type="email" id="loginEmail" placeholder="Enter your email" required />
            </div>
            <div class="field-group">
              <label>Password</label>
              <input type="password" id="loginPassword" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="primary-btn">Sign In</button>
          </form>
          <p class="switch-text">Don't have an account? <span onclick="toggleMode()">Register here</span></p>
        </div>

        <div id="registerFormWrap" class="form-panel">
          <h2>Create Account</h2>
          <form id="registerForm">
            <div class="field-group">
              <label>Full Name</label>
              <input type="text" id="registerName" placeholder="Your full name" required />
            </div>
            <div class="field-group">
              <label>Email</label>
              <input type="email" id="registerEmail" placeholder="Your email" required />
            </div>
            <div class="field-group">
              <label>Password</label>
              <input type="password" id="registerPassword" placeholder="Create password" required />
            </div>
            <div class="field-group">
              <label>Confirm Password</label>
              <input type="password" id="registerConfirm" placeholder="Confirm password" required />
            </div>
            <button type="submit" class="primary-btn">Create Account</button>
          </form>
          <p class="switch-text">Already have an account? <span onclick="toggleMode()">Sign in here</span></p>
        </div>
      </div>
    </section>

    <section id="dashboardSection" class="dashboard-section">
      <div class="dashboard-shell">
        <header class="dashboard-header">
          <div>
            <h1>Crypto Dashboard</h1>
            <p id="welcomeText">Welcome</p>
          </div>

          <div class="header-controls">
            <div class="timer-box">
              <span class="timer-icon">🔄</span>
              <span>Updates in <strong id="countdown">120</strong>s</span>
            </div>
            <button class="rtc-support-btn" onclick="openTawk()">
              <span class="live-badge">
                <span class="pulse-dot"></span>
                Live Agent
              </span>
            </button>
            <button class="ghost-btn" onclick="logoutUser()">Logout</button>
          </div>
        </header>

        <div id="loadingOverlay" class="loading-overlay">
          <div class="spinner-box">
            <div class="spinner"></div>
            <p>Updating crypto prices...</p>
          </div>
        </div>

        <div id="cryptoGrid" class="crypto-grid"></div>

        <div class="last-updated">Last updated: <span id="lastUpdated">--:--:--</span></div>
      </div>
    </section>
  </div>

  <!-- Tawk.to Live Chat Widget -->
  <script type="text/javascript">
    var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
    (function() {
      var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
      s1.async = true;
      s1.src = 'https://embed.tawk.to/6a1d4a8e69c65c1c2db679aa/1jq16mfv6';
      s1.charset = 'UTF-8';
      s1.setAttribute('crossorigin', '*');
      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>

  <!-- Custom Tawk Styling -->
  <script type="text/javascript">
    Tawk_API = window.Tawk_API || {};
    Tawk_API.onLoad = function() {
      Tawk_API.setAttributes({
        'name': 'RTC Crypto User',
        'email': document.getElementById('loginEmail')?.value || 'user@rtccrypto.com'
      }, function(error) {});
      
      // Apply custom styles
      document.documentElement.style.setProperty('--tawk-widget-header-bg', '#F0B90B');
      document.documentElement.style.setProperty('--tawk-widget-header-color', '#1E2329');
    };
  </script>

  <style>
    /* Tawk.to Custom Theme */
    :root {
      --tawk-widget-header-bg: #F0B90B;
      --tawk-widget-header-color: #1E2329;
      --tawk-agent-bubble-bg: #2B3139;
      --tawk-agent-bubble-color: #FFFFFF;
      --tawk-visitor-bubble-bg: #F0B90B;
      --tawk-visitor-bubble-color: #1E2329;
    }

    /* Override Tawk widget styles */
    .tawk-frame {
      border-radius: 12px !important;
    }

    .tawk-chatbox-header {
      background-color: #F0B90B !important;
      color: #1E2329 !important;
    }

    .tawk-agent-message {
      background-color: #2B3139 !important;
      color: #FFFFFF !important;
    }

    .tawk-visitor-message {
      background-color: #F0B90B !important;
      color: #1E2329 !important;
    }
  </style>

  <script src="js/app.js"></script>
</body>
</html>
