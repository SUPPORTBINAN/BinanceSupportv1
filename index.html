<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTC Crypto</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="main-container">
    <section id="authSection" class="auth-section show">
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand">🪙 RTC CRYPTO</div>
          <p>Follow the market, explore paper trades.</p>
        </div>

        <div id="loginFormWrap" class="form-panel show">
          <h2>Sign In</h2>
          <form id="loginForm">
            <div class="field-group">
              <label>Email</label>
              <input type="email" id="loginEmail" placeholder="Enter your email" required />
            </div>
            <div class="field-group">
              <label>Password</label>
              <input type="password" id="loginPassword" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="primary-btn">Sign In</button>
          </form>
          <p class="switch-text">Don't have an account? <span onclick="toggleMode()">Register here</span></p>
        </div>

        <div id="registerFormWrap" class="form-panel">
          <h2>Create Account</h2>
          <form id="registerForm">
            <div class="field-group">
              <label>Full Name</label>
              <input type="text" id="registerName" placeholder="Your full name" required />
            </div>
            <div class="field-group">
              <label>Email</label>
              <input type="email" id="registerEmail" placeholder="Your email" required />
            </div>
            <div class="field-group">
              <label>Password</label>
              <input type="password" id="registerPassword" placeholder="Create password" required />
            </div>
            <div class="field-group">
              <label>Confirm Password</label>
              <input type="password" id="registerConfirm" placeholder="Confirm password" required />
            </div>
            <button type="submit" class="primary-btn">Create Account</button>
          </form>
          <p class="switch-text">Already have an account? <span onclick="toggleMode()">Sign in here</span></p>
        </div>
      </div>
    </section>

    <section id="dashboardSection" class="dashboard-section">
      <div class="dashboard-shell">
        <header class="dashboard-header">
          <div>
            <h1>Crypto Dashboard</h1>
            <p id="welcomeText">Welcome</p>
          </div>

          <div class="header-controls">
            <div class="timer-box">
              <span class="timer-icon">🔄</span>
              <span>Updates in <strong id="countdown">120</strong>s</span>
            </div>
            <button class="ghost-btn" onclick="logoutUser()">Logout</button>
          </div>
        </header>

        <div id="loadingOverlay" class="loading-overlay">
          <div class="spinner-box">
            <div class="spinner"></div>
            <p>Updating crypto prices...</p>
          </div>
        </div>

        <div id="cryptoGrid" class="crypto-grid"></div>

        <div class="last-updated">Last updated: <span id="lastUpdated">--:--:--</span></div>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
